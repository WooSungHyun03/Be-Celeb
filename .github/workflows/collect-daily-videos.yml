name: Collect Daily YouTube Videos

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    name: Trigger daily collector
    runs-on: ubuntu-latest
    env:
      DAILY_COLLECT_ENDPOINT: ${{ secrets.DAILY_COLLECT_ENDPOINT }}
      DAILY_NAVER_TRENDS_ENDPOINT: ${{ secrets.DAILY_NAVER_TRENDS_ENDPOINT }}
      DAILY_SHOP_PRODUCTS_ENDPOINT: ${{ secrets.DAILY_SHOP_PRODUCTS_ENDPOINT }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in DAILY_COLLECT_ENDPOINT DAILY_NAVER_TRENDS_ENDPOINT DAILY_SHOP_PRODUCTS_ENDPOINT CRON_SECRET; do
            value="${!name:-}"
            value="$(printf '%s' "$value" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

            if [ -z "$value" ]; then
              echo "::error::$name is not configured in GitHub Actions secrets."
              missing=1
              continue
            fi

            if [ "$name" = "CRON_SECRET" ]; then
              if printf '%s' "$value" | grep -q '[[:space:]]'; then
                echo "::error::$name contains whitespace. Store only the raw secret token."
                missing=1
              else
                printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
              fi
              continue
            fi

            if printf '%s' "$value" | grep -q '[[:space:]]'; then
              echo "::error::$name contains whitespace or a newline. Store a single URL such as https://api.be-celeb.org/api/cron/collect-shop-products."
              missing=1
              continue
            fi

            case "$value" in
              http://*|https://*) ;;
              *)
                echo "::error::$name must start with http:// or https://."
                missing=1
                continue
                ;;
            esac

            if ! python3 -c 'import sys; from urllib.parse import urlparse; parsed = urlparse(sys.argv[1]); sys.exit(0 if parsed.scheme in {"http", "https"} and parsed.netloc and parsed.path else 1)' "$value"
            then
              echo "::error::$name is not a valid absolute URL."
              missing=1
              continue
            fi

            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
          exit "$missing"

      - name: Call daily YouTube collector
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --location --max-time 60 --retry 2 --retry-all-errors -X POST "$DAILY_COLLECT_ENDPOINT" \
            -H "Authorization: Bearer $CRON_SECRET"

      - name: Call daily Naver trends collector
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --location --max-time 60 --retry 2 --retry-all-errors -X POST "$DAILY_NAVER_TRENDS_ENDPOINT" \
            -H "Authorization: Bearer $CRON_SECRET"

      - name: Call daily shop products collector
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --location --max-time 60 --retry 2 --retry-all-errors -X POST "$DAILY_SHOP_PRODUCTS_ENDPOINT" \
            -H "Authorization: Bearer $CRON_SECRET"
